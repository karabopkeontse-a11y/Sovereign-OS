name: SovereignOS Windows desktop validation

on:
  push:
    branches:
      - feature/sovereign-2030-actualization
  pull_request:
    branches:
      - feature/2030-intelligence-experience
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API and native-window dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt -r requirements-desktop-native.txt
      - name: Compile desktop and core modules
        run: python -m compileall -q sovereign_core tests sovereign_os_ultimate.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
