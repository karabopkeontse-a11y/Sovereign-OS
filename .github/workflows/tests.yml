name: SovereignOS tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Compile core and tests
        run: python -m compileall -q sovereign_core tests
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
